<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog — BharatLaunch</title><meta name="description" content="Practical startup writing for Indian founders."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/blog.css"></head>
<body><header class="site-header"><div class="container nav-container"><a href="index.html" class="brand-logo"><span class="brand-logo-icon">+</span><span>BharatLaunch</span></a><nav class="nav-links" aria-label="Primary Navigation"><a href="index.html" class="nav-link">Home</a><a href="blogs.html" class="nav-link active">Blog</a><a href="about.html" class="nav-link">About</a></nav><div class="nav-actions"><a href="submit.html" class="btn btn-primary btn-sm">Submit Your Startup</a></div></div></header>
<main><section class="page-hero"><div class="container"><p class="eyebrow">THE FIELD NOTES</p><h1>Useful thinking for the work of building.</h1><p>Stories, frameworks, and grounded perspectives for founders shaping companies from India.</p></div></section><section class="blog-list-section"><div class="container"><div class="blog-list-grid" id="all-blogs"></div></div></section></main>
<script>function card(blog){const visual=blog.featuredImage?`<img src="${blog.featuredImage}" alt="" loading="lazy">`:'<span class="blog-visual-mark">BL</span>';const date=new Date(blog.publicationDate+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});return `<article class="blog-card"><a class="blog-card-image" href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">${visual}</a><div class="blog-card-body"><div class="blog-card-meta"><span>${blog.category}</span><time>${date}</time></div><h3><a href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">${blog.title}</a></h3><p>${blog.excerpt}</p><a class="text-link" href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">Read More <span aria-hidden="true">→</span></a></div></article>`}fetch('/api/blogs').then(r=>r.json()).then(blogs=>{document.getElementById('all-blogs').innerHTML=blogs.map(card).join('')}).catch(()=>{document.getElementById('all-blogs').innerHTML='<p class="empty-state">Blog posts are loading soon.</p>'})</script></body></html>
