<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Stories & Intelligence — BharatLaunch</title>
  <meta name="description" content="Editorial journalism, founder playbooks, fundraising intelligence, and ecosystem shifts across India." />
  <link rel="canonical" href="https://bharat-launch.vercel.app/blogs.html" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://bharat-launch.vercel.app/blogs.html" />
  <meta property="og:title" content="All Stories & Intelligence — BharatLaunch" />
  <meta property="og:description" content="Editorial journalism, founder playbooks, fundraising intelligence, and ecosystem shifts across India." />
  <meta property="og:image" content="https://bharat-launch.vercel.app/assets/blog-ecosystem.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://bharat-launch.vercel.app/blogs.html" />
  <meta name="twitter:title" content="All Stories & Intelligence — BharatLaunch" />
  <meta name="twitter:description" content="Editorial journalism, founder playbooks, fundraising intelligence, and ecosystem shifts across India." />
  <meta name="twitter:image" content="https://bharat-launch.vercel.app/assets/blog-ecosystem.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/blog.css" />
</head>
<body>
  <!-- Top Header -->
  <header class="site-header" role="banner">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="BharatLaunch Publication Home">
        <span class="brand-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </span>
        <span>BharatLaunch</span>
      </a>
      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="blogs.html" class="nav-link active">All Stories</a>
        <a href="ecosystem.html" class="nav-link">Ecosystem</a>
        <a href="funding.html" class="nav-link">Funding Radar</a>
        <a href="pr-news.html" class="nav-link">PR News</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="admin.html" class="nav-link" style="color: var(--color-primary); font-weight: 700;">Admin</a>
      </nav>
      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Open Navigation Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer-backdrop" id="mobile-drawer-backdrop"></div>
  <aside class="mobile-drawer" id="mobile-drawer">
    <div class="mobile-drawer-header">
      <a href="index.html" class="brand-logo">
        <span class="brand-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </span>
        <span>BharatLaunch</span>
      </a>
      <button class="mobile-drawer-close" id="mobile-drawer-close" aria-label="Close Navigation Menu">✕</button>
    </div>
    <nav class="mobile-drawer-nav">
      <a href="index.html" class="mobile-drawer-link">Home</a>
      <a href="blogs.html" class="mobile-drawer-link active">All Stories</a>
      <a href="ecosystem.html" class="mobile-drawer-link">Ecosystem Map</a>
      <a href="funding.html" class="mobile-drawer-link">Funding Radar</a>
      <a href="pr-news.html" class="mobile-drawer-link">PR News</a>
      <a href="about.html" class="mobile-drawer-link">About</a>
      <a href="admin.html" class="mobile-drawer-link" style="color: var(--color-primary); font-weight: 700;">Owner Portal</a>
    </nav>
  </aside>

  <main>
    <section class="pub-stream-section" style="padding-top: 40px;">
      <div class="container">
        <div class="pub-section-heading">
          <h2>All Published Stories</h2>
        </div>

        <div class="pub-category-filter-bar" id="category-filter-bar">
          <button class="pub-filter-btn active" data-category="ALL">All Topics</button>
          <button class="pub-filter-btn" data-category="Startup Ecosystem">Startup Ecosystem</button>
          <button class="pub-filter-btn" data-category="Fundraising">Fundraising</button>
          <button class="pub-filter-btn" data-category="Founder Playbook">Founder Playbook</button>
        </div>

        <div class="pub-stream-grid" id="all-blogs" aria-live="polite">
          <p class="pub-empty-state">Loading stories...</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <div class="footer-bottom-bar">
        <div>© 2026 BharatLaunch. Built for the Indian Startup Ecosystem.</div>
        <div style="display: flex; gap: 20px;">
          <a href="privacy-policy.html">Privacy Policy</a>
          <a href="terms-of-service.html">Terms of Service</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    const menuBtn = document.getElementById('mobile-menu-toggle');
    const drawer = document.getElementById('mobile-drawer');
    const backdrop = document.getElementById('mobile-drawer-backdrop');
    const closeBtn = document.getElementById('mobile-drawer-close');
    if (menuBtn) menuBtn.onclick = () => { drawer.classList.add('active'); backdrop.classList.add('active'); };
    if (closeBtn) closeBtn.onclick = () => { drawer.classList.remove('active'); backdrop.classList.remove('active'); };
    if (backdrop) backdrop.onclick = () => { drawer.classList.remove('active'); backdrop.classList.remove('active'); };

    let allBlogs = [];
    let activeCategory = 'ALL';

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const dateObj = new Date(dateStr + (dateStr.includes('T') ? '' : 'T00:00:00'));
      return isNaN(dateObj) ? dateStr : dateObj.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderCards(blogs) {
      const container = document.getElementById('all-blogs');
      const filtered = activeCategory === 'ALL'
        ? blogs
        : blogs.filter(b => (b.category || '').toLowerCase() === activeCategory.toLowerCase());

      if (filtered.length === 0) {
        container.innerHTML = '<p class="pub-empty-state">No stories published yet.</p>';
        return;
      }

      container.innerHTML = filtered.map(blog => {
        const coverSrc = blog.featuredImage || 'assets/blog-ecosystem.jpg';
        return `
          <article class="pub-stream-card">
            <a class="pub-stream-image-wrap" href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}" aria-label="Read ${blog.title}">
              <img src="${coverSrc}" alt="${blog.title}" loading="lazy" onerror="this.src='assets/blog-ecosystem.jpg'">
            </a>
            <div class="pub-stream-body">
              <span class="pub-category-tag">${blog.category || 'Founder Playbook'}</span>
              <h3 class="pub-stream-title">
                <a href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">${blog.title}</a>
              </h3>
              <p class="pub-stream-excerpt">${blog.excerpt || ''}</p>
              <div class="pub-stream-footer">
                <time datetime="${blog.publicationDate}">${formatDate(blog.publicationDate)}</time>
                <a class="pub-read-more" href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">Read Article →</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    document.querySelectorAll('.pub-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pub-filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.getAttribute('data-category');
        renderCards(allBlogs);
      });
    });

    fetch('/api/blogs')
      .then(r => {
        if (!r.ok) throw new Error('API fetch failed');
        return r.json();
      })
      .then(blogs => {
        allBlogs = Array.isArray(blogs) ? blogs.filter(b => b.published !== false) : [];
        renderCards(allBlogs);
      })
      .catch(() => {
        renderCards([]);
      });
  </script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
