<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Owner Blog Manager — BharatLaunch</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/blog.css"></head>
<body><header class="site-header"><div class="container nav-container"><a href="index.html" class="brand-logo"><span class="brand-logo-icon">+</span><span>BharatLaunch</span></a><div class="nav-actions"><a href="index.html" class="btn btn-secondary btn-sm">View site</a><button id="logout" class="btn btn-primary btn-sm" hidden>Log out</button></div></div></header>
<main class="admin-section"><div class="container"><div id="login-panel" class="admin-panel" style="max-width:460px;margin:0 auto"><p class="eyebrow eyebrow-dark">OWNER AREA</p><h1>Blog management</h1><p style="margin:10px 0 22px">Sign in with the website owner password to manage drafts and published posts.</p><form id="login-form" class="admin-form"><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary" type="submit">Sign in</button><div id="login-message"></div></form></div><div id="manager" hidden><div class="admin-toolbar"><div><p class="eyebrow eyebrow-dark">OWNER AREA</p><h1>Blog management</h1></div><button id="new-blog" class="btn btn-primary">New Blog</button></div><div class="admin-grid"><section class="admin-panel"><h2 id="form-title">New Blog</h2><form id="blog-form" class="admin-form"><input id="blog-slug-original" type="hidden"><label>Title<input id="blog-title" required></label><label>Slug<input id="blog-slug" required></label><label>Featured image URL<input id="blog-image" type="url" placeholder="https://..."></label><label>Category<input id="blog-category" value="Founder Playbook"></label><label>Excerpt<textarea id="blog-excerpt" rows="3" required></textarea></label><label>Full article content<textarea id="blog-content" rows="9" required></textarea></label><label>Publication date<input id="blog-date" type="date" required></label><label class="checkbox"><input id="blog-published" type="checkbox"> Publish this blog</label><button class="btn btn-primary" type="submit">Save Blog</button><div id="form-message"></div></form></section><section class="admin-panel"><h2>All Blogs</h2><div id="blog-list"></div></section></div></div></div></main>
<script>
const $ = id => document.getElementById(id); let blogs = [];
function message(id, text, error = false) { $(id).innerHTML = text ? `<div class="notice${error ? ' error' : ''}">${text}</div>` : ''; }
async function api(url, options) { const response = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options }); const data = await response.json(); if (!response.ok) throw new Error(data.error || 'Request failed.'); return data; }$env:BHARATLAUNCH_ADMIN_PASSWORD="123456"
node server.js$env:BHARATLAUNCH_ADMIN_PASSWORD="your-secure-password"
node server.js
function resetForm() { $('blog-form').reset(); $('blog-slug-original').value = ''; $('blog-date').value = new Date().toISOString().slice(0, 10); $('blog-category').value = 'Founder Playbook'; $('form-title').textContent = 'New Blog'; message('form-message', ''); }
function fillForm(blog) { $('blog-slug-original').value = blog.slug; $('blog-title').value = blog.title; $('blog-slug').value = blog.slug; $('blog-image').value = blog.featuredImage || ''; $('blog-category').value = blog.category; $('blog-excerpt').value = blog.excerpt; $('blog-content').value = blog.content; $('blog-date').value = blog.publicationDate; $('blog-published').checked = blog.published !== false; $('form-title').textContent = 'Edit Blog'; window.scrollTo({ top: 0, behavior: 'smooth' }); }
function renderList() { $('blog-list').innerHTML = blogs.map(blog => `<div class="admin-blog-row"><div><h3>${blog.title}</h3><p>${blog.category} · ${blog.publicationDate}</p></div><div class="admin-row-actions"><span class="status-dot${blog.published === false ? ' draft' : ''}">${blog.published === false ? 'Draft' : 'Published'}</span><button class="btn btn-secondary btn-sm" data-edit="${blog.slug}">Edit</button><button class="btn btn-secondary btn-sm" data-delete="${blog.slug}">Delete</button></div></div>`).join('') || '<p>No blogs yet.</p>'; document.querySelectorAll('[data-edit]').forEach(button => button.onclick = () => fillForm(blogs.find(blog => blog.slug === button.dataset.edit))); document.querySelectorAll('[data-delete]').forEach(button => button.onclick = async () => { if (!confirm('Delete this blog?')) return; try { await api('/api/blogs/' + button.dataset.delete, { method: 'DELETE' }); await loadBlogs(); } catch (error) { message('form-message', error.message, true); } }); }
async function loadBlogs() { blogs = await api('/api/blogs'); renderList(); }
async function showManager() { $('login-panel').hidden = true; $('manager').hidden = false; $('logout').hidden = false; resetForm(); await loadBlogs(); }
$('login-form').onsubmit = async event => { event.preventDefault(); try { await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ password: $('password').value }) }); await showManager(); } catch (error) { message('login-message', error.message, true); } };
$('blog-form').onsubmit = async event => { event.preventDefault(); const slug = $('blog-slug-original').value; const body = { title: $('blog-title').value, slug: $('blog-slug').value, featuredImage: $('blog-image').value, category: $('blog-category').value, excerpt: $('blog-excerpt').value, content: $('blog-content').value, publicationDate: $('blog-date').value, published: $('blog-published').checked }; try { await api('/api/blogs' + (slug ? '/' + slug : ''), { method: slug ? 'PUT' : 'POST', body: JSON.stringify(body) }); await loadBlogs(); resetForm(); message('form-message', 'Blog saved.'); } catch (error) { message('form-message', error.message, true); } };
$('new-blog').onclick = resetForm; $('logout').onclick = async () => { await api('/api/auth/logout', { method: 'POST' }); location.reload(); }; api('/api/auth/session').then(session => { if (session.authenticated) showManager(); });
</script></body></html>
