<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Blog Manager — BharatLaunch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/blog.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="BharatLaunch Home">
        <span class="brand-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        </span>
        <span>BharatLaunch</span>
      </a>
      <div class="nav-actions" style="display: flex; gap: 10px; align-items: center;">
        <a href="index.html" class="btn btn-secondary btn-sm">View Publication</a>
        <button id="logout" class="btn btn-primary btn-sm" hidden>Log out</button>
      </div>
    </div>
  </header>

  <main class="admin-section">
    <div class="container">
      
      <!-- Login Panel -->
      <div id="login-panel" class="admin-panel" style="max-width: 440px; margin: 40px auto;">
        <p class="eyebrow eyebrow-dark">OWNER AREA</p>
        <h1>Editor Portal</h1>
        <p style="margin: 10px 0 22px;">Sign in with the website owner password to manage drafts and published stories.</p>
        <form id="login-form" class="admin-form">
          <label>Password
            <input id="password" type="password" autocomplete="current-password" required placeholder="Enter password...">
          </label>
          <button class="btn btn-primary" type="submit">Sign in to Desk</button>
          <div id="login-message"></div>
        </form>
      </div>

      <!-- Manager View -->
      <div id="manager" hidden>
        <div class="admin-toolbar">
          <div>
            <p class="eyebrow eyebrow-dark">EDITORIAL DESK</p>
            <h1>Story Management</h1>
          </div>
          <button id="new-blog" class="btn btn-primary">+ New Story</button>
        </div>

        <div class="admin-grid">
          <!-- Editor Form -->
          <section class="admin-panel">
            <h2 id="form-title">New Story</h2>
            <form id="blog-form" class="admin-form">
              <input id="blog-slug-original" type="hidden">
              <label>Title
                <input id="blog-title" required placeholder="Enter story headline...">
              </label>
              <label>Slug
                <input id="blog-slug" required placeholder="story-url-slug">
              </label>
              <label>Featured Image URL
                <input id="blog-image" type="text" placeholder="assets/blog-ecosystem.jpg or https://...">
              </label>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <label>Category
                  <input id="blog-category" value="Founder Playbook" required>
                </label>
                <label>Author
                  <input id="blog-author" value="BharatLaunch Editorial" required>
                </label>
              </div>
              <label>Excerpt / Deck
                <textarea id="blog-excerpt" rows="3" required placeholder="Short summary for card preview..."></textarea>
              </label>
              <label>Full Article Markdown Content
                <textarea id="blog-content" rows="10" required placeholder="Write markdown content with ## headings, paragraphs, bullet points..."></textarea>
              </label>
              <label>Publication Date
                <input id="blog-date" type="date" required>
              </label>
              <label class="checkbox">
                <input id="blog-published" type="checkbox" checked> Publish immediately to live site
              </label>
              <button class="btn btn-primary" type="submit">Save Story</button>
              <div id="form-message"></div>
            </form>
          </section>

          <!-- Stories List -->
          <section class="admin-panel">
            <h2>All Stories (<span id="story-count">0</span>)</h2>
            <div id="blog-list" style="margin-top: 14px;"></div>
          </section>
        </div>
      </div>

    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    let blogs = [];

    function message(id, text, error = false) {
      $(id).innerHTML = text ? `<div class="notice${error ? ' error' : ''}">${text}</div>` : '';
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || 'Request failed.');
      return data;
    }

    function resetForm() {
      $('blog-form').reset();
      $('blog-slug-original').value = '';
      $('blog-date').value = new Date().toISOString().slice(0, 10);
      $('blog-category').value = 'Founder Playbook';
      $('blog-author').value = 'BharatLaunch Editorial';
      $('blog-published').checked = true;
      $('form-title').textContent = 'New Story';
      message('form-message', '');
    }

    function fillForm(blog) {
      $('blog-slug-original').value = blog.slug;
      $('blog-title').value = blog.title;
      $('blog-slug').value = blog.slug;
      $('blog-image').value = blog.featuredImage || '';
      $('blog-category').value = blog.category;
      $('blog-author').value = blog.author || 'BharatLaunch Editorial';
      $('blog-excerpt').value = blog.excerpt;
      $('blog-content').value = blog.content;
      $('blog-date').value = blog.publicationDate;
      $('blog-published').checked = blog.published !== false;
      $('form-title').textContent = 'Edit Story: ' + blog.title;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderList() {
      $('story-count').textContent = blogs.length;
      if (blogs.length === 0) {
        $('blog-list').innerHTML = '<p class="pub-empty-state">No stories in database.</p>';
        return;
      }

      $('blog-list').innerHTML = blogs.map(blog => `
        <div class="admin-blog-row">
          <div>
            <h3>${blog.title}</h3>
            <p>${blog.category} · ${blog.publicationDate} · ${blog.author || 'Editorial'}</p>
          </div>
          <div class="admin-row-actions">
            <span class="status-dot${blog.published === false ? ' draft' : ''}">${blog.published === false ? 'Draft' : 'Published'}</span>
            <button class="btn btn-secondary btn-sm" data-edit="${blog.slug}">Edit</button>
            <button class="btn btn-secondary btn-sm" data-delete="${blog.slug}">Delete</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('[data-edit]').forEach(button => {
        button.onclick = () => fillForm(blogs.find(b => b.slug === button.dataset.edit));
      });

      document.querySelectorAll('[data-delete]').forEach(button => {
        button.onclick = async () => {
          if (!confirm('Are you sure you want to permanently delete this story?')) return;
          try {
            await api('/api/blogs/' + encodeURIComponent(button.dataset.delete), { method: 'DELETE' });
            await loadBlogs();
            resetForm();
            message('form-message', 'Story deleted successfully.');
          } catch (error) {
            message('form-message', error.message, true);
          }
        };
      });
    }

    async function loadBlogs() {
      blogs = await api('/api/blogs');
      renderList();
    }

    async function showManager() {
      $('login-panel').hidden = true;
      $('manager').hidden = false;
      $('logout').hidden = false;
      resetForm();
      await loadBlogs();
    }

    $('login-form').onsubmit = async event => {
      event.preventDefault();
      try {
        await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ password: $('password').value })
        });
        await showManager();
      } catch (error) {
        message('login-message', error.message, true);
      }
    };

    $('blog-form').onsubmit = async event => {
      event.preventDefault();
      const slug = $('blog-slug-original').value;
      const body = {
        title: $('blog-title').value,
        slug: $('blog-slug').value,
        featuredImage: $('blog-image').value,
        category: $('blog-category').value,
        author: $('blog-author').value,
        excerpt: $('blog-excerpt').value,
        content: $('blog-content').value,
        publicationDate: $('blog-date').value,
        published: $('blog-published').checked
      };

      try {
        await api('/api/blogs' + (slug ? '/' + encodeURIComponent(slug) : ''), {
          method: slug ? 'PUT' : 'POST',
          body: JSON.stringify(body)
        });
        await loadBlogs();
        resetForm();
        message('form-message', 'Story saved successfully.');
      } catch (error) {
        message('form-message', error.message, true);
      }
    };

    $('new-blog').onclick = resetForm;
    $('logout').onclick = async () => {
      await api('/api/auth/logout', { method: 'POST' });
      location.reload();
    };

    api('/api/auth/session').then(session => {
      if (session && session.authenticated) showManager();
    });
  </script>
</body>
</html>
