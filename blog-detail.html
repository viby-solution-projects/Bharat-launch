<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog — BharatLaunch</title><meta name="description" content="BharatLaunch founder notes."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/blog.css"></head>
<body><header class="site-header"><div class="container nav-container"><a href="index.html" class="brand-logo" aria-label="BharatLaunch Home"><span class="brand-logo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></span><span>BharatLaunch</span></a><nav class="nav-links" aria-label="Primary Navigation"><a href="index.html" class="nav-link">Home</a><a href="blogs.html" class="nav-link active">Blog</a><a href="ecosystem.html" class="nav-link">Ecosystem</a><a href="funding.html" class="nav-link">Funding Radar</a><a href="pr-news.html" class="nav-link">PR News</a><a href="about.html" class="nav-link">About</a></nav></div></header>
<main class="article-shell"><div class="container"><article class="article" id="article"><a class="back-link" href="blogs.html">← All blogs</a><p class="empty-state">Loading article...</p></article></div></main>
<script>
const slug = new URLSearchParams(location.search).get('slug');
function renderContent(content) { return content.split(/\n\n+/).map(block => block.startsWith('## ') ? `<h2>${block.slice(3)}</h2>` : block.startsWith('### ') ? `<h3>${block.slice(4)}</h3>` : `<p>${block.replace(/\n/g, '<br>')}</p>`).join(''); }
function relatedCard(blog) { return `<article class="related-card"><div class="blog-card-meta"><span>${blog.category}</span><time>${new Date(blog.publicationDate + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</time></div><h3><a href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">${blog.title}</a></h3><a class="text-link" href="blog-detail.html?slug=${encodeURIComponent(blog.slug)}">Read Article →</a></article>`; }
async function loadArticle() { try { const response = await fetch('/api/blogs/' + encodeURIComponent(slug || '')); if (!response.ok) throw new Error('not found'); const blog = await response.json(); const all = await (await fetch('/api/blogs')).json(); const related = all.filter(item => item.slug !== blog.slug).slice(0, 2); const date = new Date(blog.publicationDate + 'T00:00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }); const readingTime = Math.max(1, Math.ceil(blog.content.split(/\s+/).length / 200)); const visual = blog.featuredImage ? `<img src="${blog.featuredImage}" alt="">` : '<span class="article-mark">BL</span>'; document.title = `${blog.title} — BharatLaunch`; document.getElementById('article').innerHTML = `<a class="back-link" href="blogs.html">← All articles</a><header class="article-header"><p class="eyebrow eyebrow-dark">${blog.category}</p><h1>${blog.title}</h1><p class="article-intro">${blog.excerpt}</p><div class="article-meta"><time datetime="${blog.publicationDate}">${date}</time><span>•</span><span class="article-reading-time">${readingTime} min read</span><span>•</span><span>BharatLaunch Editorial</span></div></header><div class="article-image">${visual}</div><div class="article-content">${renderContent(blog.content)}</div><section class="related-section"><p class="eyebrow eyebrow-dark">KEEP READING</p><h2>More from the desk</h2><div class="related-grid">${related.map(relatedCard).join('')}</div></section>`; } catch (error) { document.getElementById('article').innerHTML = '<a class="back-link" href="blogs.html">← All articles</a><h1>Article not found</h1><p>The article may have been unpublished or moved.</p>'; } }
loadArticle();
</script></body></html>
