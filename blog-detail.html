<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blog — BharatLaunch</title><meta name="description" content="BharatLaunch founder notes."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/blog.css"></head>
<body><header class="site-header"><div class="container nav-container"><a href="index.html" class="brand-logo"><span class="brand-logo-icon">+</span><span>BharatLaunch</span></a><nav class="nav-links" aria-label="Primary Navigation"><a href="index.html" class="nav-link">Home</a><a href="blogs.html" class="nav-link active">Blog</a><a href="about.html" class="nav-link">About</a></nav><div class="nav-actions"><a href="submit.html" class="btn btn-primary btn-sm">Submit Your Startup</a></div></div></header>
<main class="article-shell"><div class="container"><article class="article" id="article"><a class="back-link" href="blogs.html">← All blogs</a><p class="empty-state">Loading article...</p></article></div></main>
<script>const slug=new URLSearchParams(location.search).get('slug');fetch('/api/blogs/'+encodeURIComponent(slug||'')).then(r=>{if(!r.ok)throw new Error('not found');return r.json()}).then(blog=>{document.title=blog.title+' — BharatLaunch';const date=new Date(blog.publicationDate+'T00:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});const visual=blog.featuredImage?`<img src="${blog.featuredImage}" alt="">`:'BL';document.getElementById('article').innerHTML=`<a class="back-link" href="blogs.html">← All blogs</a><header class="article-header"><p class="eyebrow eyebrow-dark">${blog.category}</p><h1>${blog.title}</h1><div class="article-meta"><time datetime="${blog.publicationDate}">${date}</time><span>•</span><span>BharatLaunch Editorial</span></div></header><div class="article-image">${visual}</div><div class="article-content">${blog.content.split(/\n\n+/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}</div>`}).catch(()=>{document.getElementById('article').innerHTML='<a class="back-link" href="blogs.html">← All blogs</a><h1>Article not found</h1><p>The article may have been unpublished or moved.</p>'})</script></body></html>
